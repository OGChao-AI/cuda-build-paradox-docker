services:
  llama-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: llama_cpp_container
    ports:
      - "5001:5001"
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1